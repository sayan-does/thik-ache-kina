<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Remote Desktop Terminal</title>
    <link rel="stylesheet" href="xterm.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #0A0B0E;
            overflow: hidden;
            font-family: 'JetBrains Mono', 'Cascadia Code', 'SF Pro Mono', 'Consolas', monospace;
        }
        #terminal-container {
            width: 100%;
            height: 100%;
            padding: 6px 10px;
            overflow: hidden;
        }
        .xterm {
            height: 100%;
        }
        .xterm .xterm-viewport {
            overflow-y: auto !important;
        }
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0A0B0E;
        }
        ::-webkit-scrollbar-thumb {
            background: #212631;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #38BDF8;
        }
    </style>
    <script src="xterm.min.js"></script>
    <script src="addon-fit.min.js"></script>
</head>
<body>
    <div id="terminal-container"></div>
    <script>
        let term = null;
        let fitAddon = null;
        let ws = null;
        let reconnectTimer = null;

        function connectWebSocket() {
            if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) {
                return;
            }

            try {
                ws = new WebSocket("ws://127.0.0.1:8765/ws?host_client=true");

                ws.onopen = function() {
                    console.log("[Desktop Workstation] Connected to ConPTY bridge");
                    if (reconnectTimer) {
                        clearInterval(reconnectTimer);
                        reconnectTimer = null;
                    }
                    if (fitAddon && term) {
                        fitAddon.fit();
                        ws.send(JSON.stringify({
                            type: "RESIZE",
                            rows: term.rows,
                            cols: term.cols
                        }));
                    }
                };

                ws.onmessage = function(event) {
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.type === "SNAPSHOT") {
                            term.reset();
                            if (msg.payload && msg.payload.history) {
                                term.write(msg.payload.history);
                            }
                        } else if (msg.type === "OUTPUT") {
                            if (msg.data) {
                                term.write(msg.data);
                            }
                        }
                    } catch (e) {
                        console.error("Error parsing message:", e);
                    }
                };

                ws.onclose = function() {
                    console.log("[Desktop Workstation] WebSocket disconnected, reconnecting...");
                    scheduleReconnect();
                };

                ws.onerror = function() {
                    ws.close();
                };
            } catch (err) {
                console.error("WebSocket connection error:", err);
                scheduleReconnect();
            }
        }

        function scheduleReconnect() {
            if (!reconnectTimer) {
                reconnectTimer = setInterval(connectWebSocket, 1500);
            }
        }

        function initTerminal() {
            term = new Terminal({
                theme: {
                    background: '#0A0B0E',
                    foreground: '#F0F3F6',
                    cursor: '#38BDF8',
                    cursorAccent: '#0A0B0E',
                    selectionBackground: '#1E293B',
                    black: '#0A0B0E',
                    red: '#F43F5E',
                    green: '#00E599',
                    yellow: '#F59E0B',
                    blue: '#38BDF8',
                    magenta: '#A855F7',
                    cyan: '#38BDF8',
                    white: '#F0F3F6',
                    brightBlack: '#555C68',
                    brightRed: '#FB7185',
                    brightGreen: '#34D399',
                    brightYellow: '#FBBF24',
                    brightBlue: '#60A5FA',
                    brightMagenta: '#C084FC',
                    brightCyan: '#67E8F9',
                    brightWhite: '#FFFFFF'
                },
                fontFamily: "'JetBrains Mono', 'Cascadia Code', 'SF Pro Mono', 'Consolas', monospace",
                fontSize: 13,
                lineHeight: 1.25,
                cursorBlink: true,
                convertEol: true,
                scrollback: 5000,
                allowProposedApi: true
            });

            if (window.FitAddon && window.FitAddon.FitAddon) {
                fitAddon = new window.FitAddon.FitAddon();
                term.loadAddon(fitAddon);
            }

            const container = document.getElementById('terminal-container');
            term.open(container);

            if (fitAddon) {
                try {
                    fitAddon.fit();
                } catch (e) {}
            }

            // Keyboard input routing directly into ConPTY stdin stream
            term.onData(function(data) {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: "STREAM_INPUT",
                        data: data
                    }));
                }
            });

            window.addEventListener('resize', function() {
                if (fitAddon && term) {
                    try {
                        fitAddon.fit();
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({
                                type: "RESIZE",
                                rows: term.rows,
                                cols: term.cols
                            }));
                        }
                    } catch (e) {}
                }
            });

            connectWebSocket();
        }

        window.addEventListener('DOMContentLoaded', initTerminal);
    </script>
</body>
</html>
