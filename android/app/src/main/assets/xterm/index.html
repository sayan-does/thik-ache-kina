<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terminal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #090A0F;
            overflow: hidden;
            font-family: 'JetBrains Mono', 'Roboto Mono', monospace;
        }
        #terminal-container {
            width: 100%;
            height: 100%;
            padding: 8px;
            overflow: hidden;
        }
        .xterm {
            font-feature-settings: "liga" 0;
            position: relative;
            user-select: none;
            -ms-user-select: none;
            -webkit-user-select: none;
        }
        .xterm-screen {
            position: relative;
        }
        .xterm-screen canvas {
            position: absolute;
            left: 0;
            top: 0;
        }
        .xterm .xterm-viewport {
            overflow-y: scroll;
            cursor: default;
            position: absolute;
            right: 0;
            left: 0;
            top: 0;
            bottom: 0;
        }
        /* Custom scrollbar matching dark theme */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #090A0F;
        }
        ::-webkit-scrollbar-thumb {
            background: #1C202B;
            border-radius: 2px;
        }
    </style>
    <!-- Embedded minimal xterm.js bundle for zero-dependency offline rendering -->
    <script src="xterm.js"></script>
</head>
<body>
    <div id="terminal-container"></div>
    <script>
        let term;

        function initTerminal() {
            term = new Terminal({
                theme: {
                    background: '#090A0F',
                    foreground: '#E6EDF3',
                    cursor: '#06B6D4',
                    cursorAccent: '#090A0F',
                    selectionBackground: '#264F78',
                    black: '#090A0F',
                    red: '#EF4444',
                    green: '#10B981',
                    yellow: '#F59E0B',
                    blue: '#3B82F6',
                    magenta: '#8B5CF6',
                    cyan: '#06B6D4',
                    white: '#E6EDF3',
                    brightBlack: '#4B5563',
                    brightRed: '#F87171',
                    brightGreen: '#34D399',
                    brightYellow: '#FBBF24',
                    brightBlue: '#60A5FA',
                    brightMagenta: '#A78BFA',
                    brightCyan: '#22D3EE',
                    brightWhite: '#FFFFFF'
                },
                fontFamily: "'JetBrains Mono', 'Roboto Mono', monospace",
                fontSize: 12,
                lineHeight: 1.25,
                cursorBlink: true,
                convertEol: true,
                scrollback: 1000
            });

            term.open(document.getElementById('terminal-container'));

            // Notify Android of initial geometry
            if (window.AndroidInterface && window.AndroidInterface.onGeometry) {
                window.AndroidInterface.onGeometry(term.rows, term.cols);
            }

            window.addEventListener('resize', () => {
                if (window.AndroidInterface && window.AndroidInterface.onGeometry) {
                    window.AndroidInterface.onGeometry(term.rows, term.cols);
                }
            });
        }

        // Bridge methods called by Android Kotlin
        window.writeTerminal = function(data) {
            if (term) {
                term.write(data);
            }
        };

        window.clearTerminal = function() {
            if (term) {
                term.clear();
            }
        };

        window.onload = initTerminal;
    </script>
</body>
</html>
