<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agent Remote Terminal</title>
    <link rel="stylesheet" href="xterm.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            background-color: #0A0B0E;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            font-family: 'JetBrains Mono', 'Roboto Mono', 'SF Pro Mono', monospace;
        }
        #terminal-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            padding: 6px 8px;
            overflow: hidden;
        }
        .xterm {
            width: 100%;
            height: 100%;
        }
        .xterm .xterm-viewport {
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch;
        }
        /* Anti-slop custom scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0A0B0E;
        }
        ::-webkit-scrollbar-thumb {
            background: #212631;
            border-radius: 2px;
        }
    </style>
    <script src="xterm.min.js"></script>
    <script src="addon-fit.min.js"></script>
</head>
<body>
    <div id="terminal-container"></div>
    <script>
        let term = null;
        let fitAddon = null;
        const pendingQueue = [];
        let isReady = false;

        function safeFit() {
            if (!fitAddon || !term) return;
            try {
                fitAddon.fit();
                // Avoid reporting collapsed 1-line geometry to ConPTY
                if (term.rows >= 5 && term.cols >= 20) {
                    if (window.AndroidInterface && window.AndroidInterface.onGeometry) {
                        window.AndroidInterface.onGeometry(term.rows, term.cols);
                    }
                }
            } catch (e) {
                console.warn("safeFit error:", e);
            }
        }

        function initTerminal() {
            try {
                if (typeof Terminal === 'undefined') {
                    console.error("XTerm library not loaded");
                    return;
                }

                term = new Terminal({
                    theme: {
                        background: '#0A0B0E',
                        foreground: '#F0F3F6',
                        cursor: '#38BDF8',
                        cursorAccent: '#0A0B0E',
                        selectionBackground: '#1E293B',
                        black: '#0A0B0E',
                        red: '#F43F5E',
                        green: '#00E599',
                        yellow: '#F59E0B',
                        blue: '#38BDF8',
                        magenta: '#A855F7',
                        cyan: '#38BDF8',
                        white: '#F0F3F6',
                        brightBlack: '#555C68',
                        brightRed: '#FB7185',
                        brightGreen: '#34D399',
                        brightYellow: '#FBBF24',
                        brightBlue: '#60A5FA',
                        brightMagenta: '#C084FC',
                        brightCyan: '#67E8F9',
                        brightWhite: '#FFFFFF'
                    },
                    fontFamily: "'JetBrains Mono', 'Roboto Mono', 'SF Pro Mono', monospace",
                    fontSize: 11,
                    lineHeight: 1.22,
                    cursorBlink: true,
                    convertEol: true,
                    scrollback: 5000,
                    allowProposedApi: true
                });

                if (window.FitAddon && window.FitAddon.FitAddon) {
                    fitAddon = new window.FitAddon.FitAddon();
                    term.loadAddon(fitAddon);
                }

                const container = document.getElementById('terminal-container');
                term.open(container);

                isReady = true;

                // Multiple delayed layout passes to accommodate WebView layout lifecycle
                requestAnimationFrame(safeFit);
                setTimeout(safeFit, 100);
                setTimeout(safeFit, 300);
                setTimeout(safeFit, 600);

                // Observe container size changes dynamically
                if (window.ResizeObserver) {
                    const ro = new ResizeObserver(() => {
                        safeFit();
                    });
                    ro.observe(container);
                }

                // Flush any writes that arrived during initialization
                while (pendingQueue.length > 0) {
                    const chunk = pendingQueue.shift();
                    term.write(chunk);
                }

                // Notify Android bridge that terminal is ready
                if (window.AndroidInterface && window.AndroidInterface.onReady) {
                    window.AndroidInterface.onReady();
                }

                window.addEventListener('resize', safeFit);

            } catch (err) {
                console.error("Error initializing xterm:", err);
            }
        }

        window.writeTerminal = function(data) {
            if (isReady && term) {
                term.write(data);
            } else {
                pendingQueue.push(data);
            }
        };

        window.clearTerminal = function() {
            if (term) {
                term.reset();
            }
            pendingQueue.length = 0;
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initTerminal);
        } else {
            initTerminal();
        }
    </script>
</body>
</html>
